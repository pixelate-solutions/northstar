name: northstar
description: "A clean AI travel planning app — replace your travel agent."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.4.1

  # Navigation
  go_router: ^14.2.7

  # Backend / Auth
  supabase_flutter: ^2.8.0
  local_auth: ^2.3.0
  shared_preferences: ^2.5.5

  # HTTP + SSE streaming (agent client)
  http: ^1.2.2

  # Maps — cross-platform (iOS, Android, Web, macOS), no API key
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Offline caching
  hive_flutter: ^1.1.0

  # Local notifications + timezone support
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Connectivity detection
  connectivity_plus: ^6.0.3

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  clerk_flutter: ^0.0.14-beta
  image_picker: ^1.2.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
